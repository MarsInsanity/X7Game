# X7 Game settings - edit on a PC (this card's X7GAME drive), then put the
# card back in the console. One KEY=VALUE per line; lines starting with #
# are ignored. Delete a line to get the default back.

# Battery levels use the console's own scale: about 128 = empty,
# 175 = full (about 2 % per step). The console itself dies near 128.
# Refuse to start at or below this level (unless a charger is plugged in):
battery_boot_level=132
# Turn off cleanly after 30 seconds at or below this level (unless charging):
battery_off_level=130

# Headphone jack: if plugging/unplugging is reported the wrong way round
# (sound stays on the speaker with headphones in), change 0 to 1.
headphone_plugged_level=0

# Volume when the console starts, 0-100.
volume_percent=25
