# X7 Game settings - edit on a PC (this card's X7GAME drive), then put the
# card back in the console. One KEY=VALUE per line; text after a # is
# ignored. Every setting below is commented out, so X7 Game's own default
# applies (and follows updates). To change one, remove the # in front of it
# and edit the value. Lines the console can't use are listed in
# x7game/logs/boot.log ("ignored x7game.cfg line").

# Battery levels use the console's own scale: about 128 = empty,
# 175 = full (about 2 % per step). The console itself dies near 128.
# Refuse to start at or below this level (unless a charger is plugged in):
#battery_boot_level=132
# Turn off cleanly after 30 seconds at or below this level (unless
# charging; 0 = never):
#battery_off_level=130

# Headphone jack: if plugging/unplugging is reported the wrong way round
# (sound stays on the speaker with headphones in), use 1. If the switching
# is unreliable, use off: always use the speaker, ignore the detect pin.
#headphone_plugged_level=0

# Install an update file (.x7update on X7DATA) only at or above this battery
# level (about 25 %), unless a charger is plugged in:
#battery_update_level=140

# Volume when the console starts, 0-100.
#volume_percent=25

# Compressed memory (zram) for big games, in MiB: 32-128, 0 = off.
#zram_mb=32

# Screen: dim after this many seconds without a button press, and switch it
# off after this many (0 = never, the default; e.g. 120 and 300). Any button
# brings it back. The brightness itself: FN + VOL+/VOL- (it is remembered).
#dim_after_s=0
#screen_off_after_s=0
# How dark "dim" is, 0-255 (full brightness is 255):
#dim_level=20

# Experimental: write the screen faster in games (1 = on). Measure first with
# x7-fbspeed over the USB shell; turn it off again if the picture is wrong.
#fb_writecombine=0
