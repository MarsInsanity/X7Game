# X7 Game defaults. Do not edit here: put your own values in
# x7game/x7game.cfg on the SD card (the FAT32 drive a PC shows); they are
# read at every start and win over these.

# Battery levels are the console's own ADC scale (about 128 = empty,
# 175 = full; about 2 % per step). The hardware itself dies near 128.
# Don't start when the battery is at or below this (unless charging):
battery_boot_level=132
# Turn off cleanly after 30 s at or below this (unless charging; 0 = never):
battery_off_level=130

# Headphone jack: the raw level of the detect pin (L15) that means
# "headphones plugged in", 0 or 1. Swap it if plugging/unplugging is shown
# the wrong way round. off: always use the speaker, ignore the detect pin
# (if the switching is unreliable).
headphone_plugged_level=0

# Install an update file (.x7update on X7DATA) only at or above this battery
# level (about 25 %), unless a charger is plugged in:
battery_update_level=140

# Volume at start, 0-100 %.
volume_percent=25

# Compressed memory (zram, S41x7zram) in MiB: 32-128, 0 = off.
zram_mb=32

# Screen: dim to dim_level (0-255) after dim_after_s seconds without a button
# press, switch the backlight off after screen_off_after_s; 0 = never. Any
# button brings the screen back. The brightness itself is set with
# FN + VOL+/VOL- and kept in x7game/brightness on the SD card.
dim_after_s=0
screen_off_after_s=0
dim_level=20

# Map the screen write-combined for programs (faster emulator frames, kernel
# patch 0018): 1 = on. Off until it is confirmed on this console; measure
# with x7-fbspeed over the USB shell.
fb_writecombine=0
