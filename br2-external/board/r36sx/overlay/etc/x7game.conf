# X7 Game defaults. Do not edit here: put your own values in
# x7game/x7game.cfg on the SD card (the FAT32 drive a PC shows); they are
# read at every start and win over these.

# Battery levels are the console's own ADC scale (about 128 = empty,
# 175 = full; about 2 % per step). The hardware itself dies near 128.
# Don't start when the battery is at or below this (unless charging):
battery_boot_level=132
# Turn off cleanly after 30 s at or below this (unless charging):
battery_off_level=130

# Headphone jack: the raw level of the detect pin (L15) that means
# "headphones plugged in", 0 or 1. Swap it if plugging/unplugging is shown
# the wrong way round.
headphone_plugged_level=0

# The data partition (X7DATA, the second drive a PC shows) is made at the
# first start with this file system: exfat (default, no 4 GB file limit)
# or fat32. Changing it later does nothing: the partition is never
# formatted again.
data_filesystem=exfat

# Volume at start, 0-100 %.
volume_percent=25
