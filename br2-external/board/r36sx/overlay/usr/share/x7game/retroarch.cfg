# RetroArch defaults for X7 Game. x7-launch copies this file to
# /share/system/retroarch/retroarch.cfg the first time a game starts; after
# that the copy on the data partition is used (and RetroArch saves menu
# changes into it). Delete the copy to get these defaults back.
# The drivers and folders are set by /usr/share/x7game/retroarch-fixed.cfg.

config_save_on_exit = "true"

# --- Video: x7fb draws 16-bit on the 640x480 panel; there is no vsync, so
# the audio clock paces the games (audio_sync) ---
video_vsync = "false"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
video_force_aspect = "true"
video_refresh_rate = "60.000000"
video_frame_delay = "0"
video_font_enable = "true"
fps_show = "false"

# --- Audio: the "R36S" sound card ---
audio_enable = "true"
audio_device = ""
audio_out_rate = "48000"
audio_latency = "64"
audio_sync = "true"
audio_rate_control = "true"
audio_resampler = "nearest"
audio_resampler_quality = "1"

# --- Speed ---
fastforward_ratio = "3.000000"
rewind_enable = "false"
savestate_thumbnail_enable = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
history_list_enable = "false"

# --- Saves: per system (saves/<system>, after the ROM folder's name) ---
sort_savefiles_by_content_enable = "true"
sort_savestates_by_content_enable = "true"

# --- Menu (RGUI) ---
rgui_show_start_screen = "false"
menu_pause_libretro = "true"
menu_show_advanced_settings = "false"
quit_press_twice = "false"
notification_show_autoconfig = "false"
pause_on_disconnect = "false"

# --- Buttons: the "X7 Game Gamepad" (x7-padd). RetroArch numbers its
# buttons in kernel order: 0 B, 1 A, 2 X, 3 Y, 4 L1, 5 R1, 6 L2, 7 R2,
# 8 SELECT, 9 START, 10 FN; the D-pad is hat 0 ---
input_autodetect_enable = "false"
input_max_users = "1"
input_player1_joypad_index = "0"
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_x_btn = "2"
input_player1_y_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_l2_btn = "6"
input_player1_r2_btn = "7"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_player1_up_btn = "h0up"
input_player1_down_btn = "h0down"
input_player1_left_btn = "h0left"
input_player1_right_btn = "h0right"
input_menu_toggle_gamepad_combo = "0"
input_quit_gamepad_combo = "0"

# --- Hotkeys: hold FN and press ---
#   X       menu                START   quit to the game list
#   L1      load state          R1      save state
#   D-pad <> state slot - / +   R2      fast forward (on/off)
#   Y       screenshot          B       pause
#   SELECT  reset
input_enable_hotkey_btn = "10"
input_menu_toggle_btn = "2"
input_exit_emulator_btn = "9"
input_load_state_btn = "4"
input_save_state_btn = "5"
input_state_slot_decrease_btn = "h0left"
input_state_slot_increase_btn = "h0right"
input_toggle_fast_forward_btn = "7"
input_screenshot_btn = "3"
input_pause_toggle_btn = "0"
input_reset_btn = "8"
