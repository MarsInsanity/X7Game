# X7 Game's starting core options. x7-launch copies this file to
# /share/system/retroarch/retroarch-core-options.cfg when it is missing;
# RetroArch takes each core's first options from it (then keeps them per
# core, changeable in the menu: Quick Menu > Core Options).
#
# Automatic frameskip for the systems that can fall behind on this console:
# a frame is skipped only when the sound buffer runs low (the game would
# otherwise slow down and crackle), so light games are not affected.
snes9x_2005_frameskip = "auto"
picodrive_frameskip = "auto"
gpsp_frameskip = "auto"
pce_fast_frameskip = "auto"
fba2012cps1_frameskip = "auto"
fba2012cps2_frameskip = "auto"
fbalpha2012_neogeo_frameskip = "auto"
