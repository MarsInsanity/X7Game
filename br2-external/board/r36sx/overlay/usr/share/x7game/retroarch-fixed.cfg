# RetroArch settings X7 Game always applies (x7-launch passes this file with
# --appendconfig, so it wins over /share/system/retroarch/retroarch.cfg).
# Only what must be right for the console is here: the drivers it has and
# where things live on the data partition. Everything else (buttons, hotkeys,
# audio latency, aspect) is in retroarch.cfg and can be changed in the menu.

video_driver = "x7fb"
input_driver = "udev"
input_joypad_driver = "udev"
audio_driver = "alsa"
menu_driver = "rgui"

libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
system_directory = "/share/bios"
savefile_directory = "/share/saves"
savestate_directory = "/share/saves"
screenshot_directory = "/share/screenshots"
rgui_browser_directory = "/share/roms"
rgui_config_directory = "/share/system/retroarch"
core_options_path = "/share/system/retroarch/retroarch-core-options.cfg"
input_remapping_directory = "/share/system/retroarch/remaps"
playlist_directory = "/share/system/retroarch/playlists"
content_history_path = "/share/system/retroarch/content_history.lpl"
cache_directory = "/share/system/retroarch/cache"
log_dir = "/share/system/retroarch/logs"

# nothing to download without a network
menu_show_core_updater = "false"
menu_show_online_updater = "false"
