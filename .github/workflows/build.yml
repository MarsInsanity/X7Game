name: Build X7 Game

# Builds the SD card image with Buildroot. A pushed tag "vX.Y.Z" (or a manual
# run with "release" ticked) publishes the image as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0). Empty = dev build named after the commit"
        required: false
        default: ""
      release:
        description: "Publish a GitHub release (needs a version)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      BR_VERSION: "2026.02.3"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            ver="${GITHUB_REF_NAME#v}"
            # a manual run on a tag builds that tag: a different typed
            # version would be silently ignored
            if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$ver" ]; then
              echo "version $INPUT_VERSION does not match the tag $GITHUB_REF_NAME"; exit 1
            fi
          elif [ -n "$INPUT_VERSION" ]; then
            ver="$INPUT_VERSION"
          else
            ver="dev-${GITHUB_SHA::7}"
          fi
          case "$ver" in *[!A-Za-z0-9._-]*) echo "bad version: $ver"; exit 1 ;; esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "X7_VERSION=$ver" >> "$GITHUB_ENV"
          echo "X7_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "Building X7 Game $ver"

      # the runner disk usually has far more room than the build needs, and
      # deleting these tools takes about two minutes: only do it when short
      - name: Free disk space
        run: |
          avail=$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex cpio \
            rsync unzip file wget python3 git xz-utils zip libssl-dev libncurses-dev

      # restored here, saved at the end even when the build fails, so a retry
      # does not rebuild the toolchain from scratch
      - name: Restore Buildroot downloads and ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildroot-dl
            ~/.buildroot-ccache
          key: br-${{ env.BR_VERSION }}-${{ github.run_id }}
          restore-keys: |
            br-${{ env.BR_VERSION }}-

      - name: Build
        env:
          X7_V27_KEY: ${{ secrets.X7_V27_KEY }}
        run: |
          mkdir -p ~/.buildroot-dl
          export BR2_DL_DIR=~/.buildroot-dl
          scripts/build.sh "$GITHUB_WORKSPACE/output" 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Save Buildroot downloads and ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildroot-dl
            ~/.buildroot-ccache
          key: br-${{ env.BR_VERSION }}-${{ github.run_id }}

      - name: Package
        id: pkg
        run: |
          mkdir -p dist
          cd output/images
          for img in x7game-*.img; do
            zip -9 -j "$GITHUB_WORKSPACE/dist/${img}.zip" "$img"
            xz -9 -T0 -k -c "$img" > "$GITHUB_WORKSPACE/dist/${img}.xz"
          done
          cp x7game-*.x7update "$GITHUB_WORKSPACE/dist/"
          cp boot-files/boot-files.json "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum * > SHA256SUMS
          ls -l
          cat SHA256SUMS

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x7game-${{ steps.v.outputs.version }}
          path: |
            dist/
            build.log
          if-no-files-found: warn

      - name: Publish release
        # a manual run on a tag ref publishes only with "release" ticked
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (inputs.release && inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${X7_VERSION}"
          # a release must match the source at its tag: never attach this
          # build to a tag that names another commit (a reused version number;
          # gh release create ignores --target when the tag exists). Asked of
          # the remote, since a manual run checks out no tags; an annotated
          # tag's peeled ^{} line names its commit
          refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          tagged=$(awk -v ref="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" \
            '$2 == ref { c = $1 } $2 == peeled { p = $1 } END { print (p != "" ? p : c) }' <<< "$refs")
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "tag $tag already points at another commit ($tagged); bump the version"
            exit 1
          fi
          cat > notes.md <<EOF
          X7 Game ${X7_VERSION} (commit ${X7_COMMIT}) for the R36SX / R36S V2.6 / V2.7 (HiChip E3100).

          **Flash \`x7game-r36sx-${X7_VERSION}.img\`** (inside the .zip or .xz) to a microSD card with
          balenaEtcher or Rufus, put it in the TF1 slot and switch the console on. This image is for
          consoles that run the V2.6 firmware stack (unencrypted boot files). Files named
          \`v27protected\` (if present) are for "bootloader protected" V2.7 consoles.

          **Already running X7 Game 0.3 or newer?** Copy \`x7game-r36sx-${X7_VERSION}.x7update\` into the
          X7DATA drive and switch the console on: it installs itself and restarts. Your files and
          settings stay. (From 0.2 or older, flash the image once; X7DATA is kept.)

          See the README for what works, the USB serial shell and how to report problems.
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "X7 Game ${X7_VERSION}" \
              --notes-file notes.md --prerelease
          fi
